[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-audit"
version = "0.1.0"
description = "A command-line tool that evaluates basic website quality signals for agency workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "mstonedev" }
]
keywords = ["audit", "website", "cli", "seo", "quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
site-audit = "site_audit.cli:main"

[tool.setuptools]
package-dir = {"site_audit" = "site-audit"}

[tool.setuptools.packages]
find = { include = ["site_audit*"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
